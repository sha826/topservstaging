<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="An illustration of 2 paid channels side by side, one charging per call and one charging per click, feeding a single booked job">
  <defs>
    <linearGradient id="ground3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0e12"/>
      <stop offset="1" stop-color="#12151b"/>
    </linearGradient>
    <linearGradient id="leftCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ed844" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#9ed844" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="rightCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7dc1" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#0e7dc1" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="merge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ed844"/>
      <stop offset="1" stop-color="#0e7dc1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#ground3)"/>

  <!-- Channel 1: paid per call. -->
  <g>
    <rect x="96" y="80" width="440" height="290" rx="18" fill="url(#leftCard)" stroke="#9ed844" stroke-opacity="0.55" stroke-width="2"/>
    <g transform="translate(316 196)">
      <path d="M-46 -34 C -46 -46, -34 -52, -26 -46 L -8 -32 C -1 -26, -1 -18, -6 -11 L -16 2 C -6 22, 10 38, 30 48 L 43 38 C 50 33, 58 33, 64 40 L 78 58 C 84 66, 78 78, 66 78 C 6 78, -46 26, -46 -34 Z" fill="#9ed844"/>
    </g>
    <g fill="#9ed844" fill-opacity="0.75">
      <rect x="152" y="300" width="170" height="12" rx="6"/>
    </g>
    <rect x="152" y="326" width="286" height="9" rx="4.5" fill="#8a919c" fill-opacity="0.45"/>
  </g>

  <!-- Channel 2: paid per click. -->
  <g>
    <rect x="664" y="80" width="440" height="290" rx="18" fill="url(#rightCard)" stroke="#0e7dc1" stroke-opacity="0.6" stroke-width="2"/>
    <g transform="translate(884 196)">
      <path d="M-30 -52 L 40 -6 L 6 2 L 26 44 L 4 54 L -14 12 L -38 34 Z" fill="#3d9bd9"/>
      <circle cx="-2" cy="-2" r="62" fill="none" stroke="#0e7dc1" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="8 10"/>
    </g>
    <g fill="#3d9bd9" fill-opacity="0.75">
      <rect x="720" y="300" width="140" height="12" rx="6"/>
    </g>
    <rect x="720" y="326" width="286" height="9" rx="4.5" fill="#8a919c" fill-opacity="0.45"/>
  </g>

  <!-- Coordinated, not competing: both paths meet at 1 booked job. -->
  <path d="M316 370 C 316 452, 480 448, 580 486" fill="none" stroke="#9ed844" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M884 370 C 884 452, 720 448, 620 486" fill="none" stroke="#0e7dc1" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8"/>
  <rect x="520" y="486" width="160" height="56" rx="28" fill="#171c23" stroke="url(#merge)" stroke-width="2.5"/>
  <circle cx="600" cy="514" r="10" fill="url(#merge)"/>
</svg>
