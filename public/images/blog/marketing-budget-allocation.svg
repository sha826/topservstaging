<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="An illustration of a marketing budget split into channel segments above a year of seasonal demand">
  <defs>
    <linearGradient id="ground2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0e12"/>
      <stop offset="1" stop-color="#12151b"/>
    </linearGradient>
    <linearGradient id="seg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7e76a"/>
      <stop offset="1" stop-color="#9ed844"/>
    </linearGradient>
    <linearGradient id="seg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ed844" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7cb92f" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="seg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d9bd9"/>
      <stop offset="1" stop-color="#0e7dc1"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7dc1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0e7dc1" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9ed844" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#9ed844" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#ground2)"/>
  <ellipse cx="600" cy="200" rx="520" ry="220" fill="url(#glow2)"/>

  <!-- The allocation. Proportions are illustrative, no figures are stated. -->
  <g>
    <rect x="96" y="150" width="1008" height="96" rx="16" fill="#12151b" stroke="#242a33"/>
    <rect x="104" y="158" width="330" height="80" rx="10" fill="url(#seg1)"/>
    <rect x="442" y="158" width="250" height="80" rx="10" fill="url(#seg2)" stroke="#9ed844" stroke-opacity="0.5"/>
    <rect x="700" y="158" width="196" height="80" rx="10" fill="url(#seg3)"/>
    <rect x="904" y="158" width="192" height="80" rx="10" fill="#171c23" stroke="#242a33"/>
    <g fill="#0c0e12" fill-opacity="0.35">
      <rect x="136" y="188" width="150" height="9" rx="4.5"/>
      <rect x="136" y="206" width="96" height="7" rx="3.5"/>

      <rect x="732" y="188" width="86" height="9" rx="4.5"/>
      <rect x="732" y="206" width="56" height="7" rx="3.5"/>
    </g>
    <g fill="#8a919c" fill-opacity="0.4">
      <rect x="936" y="188" width="80" height="9" rx="4.5"/>
      <rect x="936" y="206" width="52" height="7" rx="3.5"/>
    </g>
    <g fill="#9ed844" fill-opacity="0.8">
      <rect x="474" y="188" width="110" height="9" rx="4.5"/>
      <rect x="474" y="206" width="70" height="7" rx="3.5"/>
    </g>
  </g>

  <!-- Seasonality. 12 stylized periods under a steady spend line. -->
  <g transform="translate(0 40)">
    <path d="M96 470 C 200 470, 236 386, 320 372 C 404 358, 452 430, 540 442 C 628 454, 668 350, 760 330 C 852 310, 900 404, 1000 424 C 1060 436, 1082 450, 1104 462 L1104 500 L96 500 Z" fill="url(#wave)"/>
    <path d="M96 470 C 200 470, 236 386, 320 372 C 404 358, 452 430, 540 442 C 628 454, 668 350, 760 330 C 852 310, 900 404, 1000 424 C 1060 436, 1082 450, 1104 462" fill="none" stroke="#0e7dc1" stroke-width="4" stroke-linecap="round" stroke-opacity="0.85"/>
    <line x1="96" y1="416" x2="1104" y2="416" stroke="#9ed844" stroke-width="3" stroke-dasharray="14 12" stroke-opacity="0.9"/>
    <g fill="#242a33">
      <rect x="96" y="500" width="60" height="10" rx="5"/>
      <rect x="180" y="500" width="60" height="10" rx="5"/>
      <rect x="264" y="500" width="60" height="10" rx="5"/>
      <rect x="348" y="500" width="60" height="10" rx="5"/>
      <rect x="432" y="500" width="60" height="10" rx="5"/>
      <rect x="516" y="500" width="60" height="10" rx="5"/>
      <rect x="600" y="500" width="60" height="10" rx="5"/>
      <rect x="684" y="500" width="60" height="10" rx="5"/>
      <rect x="768" y="500" width="60" height="10" rx="5"/>
      <rect x="852" y="500" width="60" height="10" rx="5"/>
      <rect x="936" y="500" width="60" height="10" rx="5"/>
      <rect x="1020" y="500" width="60" height="10" rx="5"/>
    </g>
  </g>
</svg>
